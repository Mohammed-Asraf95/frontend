<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform</title>
    <style>
        div {
            width: 150px;
            height: 150px;
            text-align: center;
            background-color: yellow;
            border: 4px solid black;
        }
        div:hover {
            transform: translate(400px, 150px);
        }
    </style>
</head>

<body>
    <div>Hello</div>
    
</body>
</html>
